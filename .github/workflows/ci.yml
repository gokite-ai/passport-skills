name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate skill structure
        run: bash scripts/validate.sh

  lint:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint markdown
        run: npm run lint

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Covers top-level scripts/ and the per-skill bundled copies under */scripts/
      - name: Run shellcheck on all shell scripts
        run: shellcheck scripts/*.sh */scripts/*.sh

  setup-scripts:
    name: Setup script behaviour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # --help must work. It used to reference MIN_KAGENT_VERSION before the
      # block that defines it, so under `set -u` it exited on an unbound
      # variable — invisible until someone asked for help.
      - name: setup scripts answer --help
        run: |
          set -euo pipefail
          for s in scripts/setup.sh scripts/setup-ksearch.sh; do
            [ -f "$s" ] || continue
            out=$(bash "$s" --help 2>&1) || { echo "FAIL: $s --help exited $?"; echo "$out"; exit 1; }
            grep -q "Usage" <<<"$out" || { echo "FAIL: $s --help printed no usage"; exit 1; }
            echo "  ok  $s"
          done

      - name: Test set-installer-base.sh
        run: bash scripts/test-set-installer-base.sh

