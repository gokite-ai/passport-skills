name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate skill structure
        run: bash scripts/validate.sh

  lint:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint markdown
        run: npm run lint

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Covers top-level scripts/ and the per-skill bundled copies under */scripts/
      - name: Run shellcheck on all shell scripts
        run: shellcheck scripts/*.sh */scripts/*.sh

  setup-scripts:
    name: Setup script behaviour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # --help must work. It used to reference MIN_KAGENT_VERSION before the
      # block that defines it, so under `set -u` it exited on an unbound
      # variable — invisible until someone asked for help.
      - name: setup scripts answer --help
        run: |
          set -euo pipefail
          for s in scripts/setup.sh scripts/setup-kagent.sh scripts/setup-ksearch.sh \
                   seller-agent-setup/scripts/setup-kagent.sh; do
            [ -f "$s" ] || continue
            out=$(bash "$s" --help 2>&1) || { echo "FAIL: $s --help exited $?"; echo "$out"; exit 1; }
            grep -q "Usage" <<<"$out" || { echo "FAIL: $s --help printed no usage"; exit 1; }
            echo "  ok  $s"
          done

      # Version precedence, including the case that matters: a release
      # candidate must NOT satisfy a floor naming its own release.
      - name: kagent floor uses SemVer precedence
        run: |
          set -euo pipefail
          sed -n '/^version_at_least() {/,/^}/p' scripts/setup-kagent.sh > /tmp/vcmp.sh
          cat >> /tmp/vcmp.sh <<'T'
          fails=0
          t() { if version_at_least "$1" "$2"; then r=yes; else r=no; fi
                if [ "$r" != "$3" ]; then echo "  FAIL: $1 >= $2 gave $r, want $3"; fails=$((fails+1)); fi; }
          t 1.11.0       1.11.0       yes
          t 1.11.1       1.11.0       yes
          t 1.10.9       1.11.0       no
          t 1.11.0-rc.1  1.11.0       no
          t 1.11.0       1.11.0-rc.1  yes
          t 1.11.0-rc.2  1.11.0-rc.1  yes
          t 1.11.0-rc    1.11.0-rc.1  no
          t 1.11.0-alpha 1.11.0-beta  no
          t 1.11.0-1     1.11.0-alpha no
          t unknown      1.11.0       no
          [ "$fails" -eq 0 ] || exit 1
          echo "  ok  10 precedence cases"
          T
          bash /tmp/vcmp.sh

